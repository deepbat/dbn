<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deepak Batra — Visual Archive &amp; Portfolio</title>
  <meta name="description" content="A visual archive of Deepak Batra's photography — 15 frames in a tight editorial scroll with a scroll-scrubbed cinema intro." />
  <link rel="canonical" href="https://deepak.my.id/gallery.html" />

  <!-- Social / link previews -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Deepak Batra" />
  <meta property="og:title" content="Deepak Batra — Visual Archive" />
  <meta property="og:description" content="15 frames in a tight editorial scroll with a scroll-scrubbed cinema intro." />
  <meta property="og:url" content="https://deepak.my.id/gallery.html" />
  <meta property="og:image" content="https://deepak.my.id/gallery-16.webp" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Deepak Batra — Visual Archive" />
  <meta name="twitter:description" content="15 frames in a tight editorial scroll with a scroll-scrubbed cinema intro." />
  <meta name="twitter:image" content="https://deepak.my.id/gallery-16.webp" />

  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Preload Local Fonts -->
  <link rel="preload" href="f-instrument-serif.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="f-instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="f-inter.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="f-jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin />

  <style>
    @font-face {
      font-family: 'Instrument Serif';
      src: url('f-instrument-serif.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Instrument Serif';
      src: url('f-instrument-serif-italic.woff2') format('woff2');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: 'Inter';
      src: url('f-inter.woff2') format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      src: url('f-jetbrains-mono.woff2') format('woff2');
      font-weight: 100 800;
      font-display: swap;
    }

    :root {
      --bg: #f6f4f0;
      --fg: #141413;
      --muted: #6e6d68;
      --accent: #c84b31;
      --border: rgba(20, 20, 19, 0.12);
      --card-bg: rgba(255, 255, 255, 0.6);
      --scroll-velocity: 0;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* Minimal Top Bar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.55rem 1rem;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .topbar a {
      color: var(--fg);
      text-decoration: none;
      padding: 0.25rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .topbar a:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .topbar a:focus-visible,
    .gallery-item:focus-visible,
    .lightbox-close:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Kinetic Velocity Distortion */
    .kinetic-skew {
      transform: skewY(calc(var(--scroll-velocity) * 0.14deg));
      transition: transform 0.12s linear;
      will-change: transform;
    }

    /* Hero & Scroll-Scrubbed Cinema */
    .hero-cinema {
      position: relative;
      height: 150vh;
    }

    .cinema-sticky {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4rem 4vw 1.5rem;
      overflow: hidden;
    }

    .cinema-video-wrap {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0.28;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .cinema-video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-top {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .portrait-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.65rem;
      border: 1px solid var(--border);
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 12px;
    }

    .portrait-card img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
    }

    .portrait-meta {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      line-height: 1.5;
    }

    .hero-title {
      position: relative;
      z-index: 2;
      font-family: var(--font-serif);
      font-size: clamp(2.75rem, 9vw, 8rem);
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.02em;
    }

    .hero-title em {
      font-style: italic;
      color: var(--accent);
    }

    .cinema-scrub-bar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }

    /* Editorial Scroll Archive */
    .archive-section {
      padding: 2rem 4vw 4rem;
      max-width: 1600px;
      margin: 0 auto;
    }

    .editorial-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 1.5rem 1.25rem;
    }

    .gallery-item {
      grid-column: span 4;
      position: relative;
      cursor: pointer;
    }

    .gallery-item:nth-child(5n+1) {
      grid-column: span 8;
    }

    .gallery-item:nth-child(7n+3) {
      grid-column: span 6;
    }

    .img-frame {
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
    }

    .img-frame img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
    }

    .gallery-item:hover .img-frame img {
      transform: scale(1.04);
    }

    .item-caption {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
    }

    .item-caption .serif-label {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.15rem;
      color: var(--fg);
    }

    /* Denser mobile: two columns, smaller captions */
    @media (max-width: 900px) {
      .editorial-grid {
        gap: 1rem 0.75rem;
      }
      .gallery-item,
      .gallery-item:nth-child(5n+1),
      .gallery-item:nth-child(7n+3) {
        grid-column: span 6;
      }
      .item-caption {
        flex-direction: column;
        gap: 0.1rem;
        font-size: 0.62rem;
      }
      .item-caption .serif-label {
        font-size: 0.95rem;
      }
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(10, 10, 12, 0.92);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 4px;
    }

    .lightbox-close {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }

    body.lightbox-locked {
      overflow: hidden;
    }

    @media (max-width: 640px) {
      .lightbox {
        padding: 1rem;
      }
      .lightbox img {
        max-width: 94vw;
        max-height: 80vh;
      }
    }

    /* Reduced motion: no skew, no smooth scroll, no hover zoom, calmer video */
    @media (prefers-reduced-motion: reduce) {
      html, body {
        transition: none;
      }
      .kinetic-skew {
        transform: none !important;
        transition: none;
        will-change: auto;
      }
      .img-frame img,
      .cinema-video-wrap {
        transition: none;
      }
      .gallery-item:hover .img-frame img {
        transform: none;
      }
      .hero-cinema {
        height: 100vh;
        height: 100svh;
      }
    }
  </style>
</head>
<body>

  <!-- Minimal Top Bar -->
  <nav class="topbar" aria-label="Navigation">
    <span>DBN // Visual Archive</span>
    <a href="index.html">&larr; Home</a>
  </nav>

  <!-- Scroll-Scrubbed Cinema + Archive -->
  <section class="hero-cinema" id="cinemaSection">
    <div class="cinema-sticky">
      <div class="cinema-video-wrap">
        <video id="heroVideo" src="clip-01.mp4" muted playsinline preload="metadata" aria-hidden="true" tabindex="-1"></video>
      </div>

      <div class="hero-top">
        <div class="portrait-card">
          <picture>
            <source srcset="portrait-720.jpg" media="(max-width: 768px)" />
            <img src="assets/portrait.jpg" alt="Deepak Batra" />
          </picture>
          <div class="portrait-meta">
            <div><strong>DEEPAK BATRA</strong></div>
            <div>HOST // deepak.my.id</div>
            <div id="liveVelocity">VEL // 0.00 px/f</div>
          </div>
        </div>
      </div>

      <h1 class="hero-title kinetic-skew">
        Selected <em>Visual</em><br />Works &amp; Index
      </h1>

      <div class="cinema-scrub-bar">
        <span>CLIP-01.MP4 // SCROLL-SCRUBBED TIMELINE</span>
        <span id="timecodeDisplay">TC 00:00.00</span>
      </div>
    </div>
  </section>

  <main class="archive-section">
    <div class="editorial-grid" id="editorialGrid"></div>
  </main>

  <!-- Fullscreen Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Expanded photo">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close expanded photo">&times;</button>
    <img id="lightboxImg" src="" alt="" />
  </div>

  <!-- Local Smooth Scroll Library -->
  <script src="lenis.js"></script>
  <script>
    // 1. Exact Gallery Manifest from Repository
    const galleryIds = [14, 16, 17, 18, 19, 20, 21, 22, 23, 25, 26, 27, 28, 29, 30];
    const galleryItems = galleryIds.map((num) => ({
      id: `GAL-${num}`,
      num: num,
      src: `gallery-${num}.webp`,
      title: `Archive Plate No. ${num}`
    }));

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 2. Populate the Editorial Scroll View
    const editorialGrid = document.getElementById('editorialGrid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    let lenis = null;
    let lastFocused = null;

    function openLightbox(item) {
      lastFocused = document.activeElement;
      lightboxImg.src = item.src;
      lightboxImg.alt = item.title;
      lightbox.classList.add('open');
      document.body.classList.add('lightbox-locked');
      if (lenis) lenis.stop();
      lightboxClose.focus();
    }

    function closeLightbox() {
      if (!lightbox.classList.contains('open')) return;
      lightbox.classList.remove('open');
      document.body.classList.remove('lightbox-locked');
      if (lenis) lenis.start();
      if (lastFocused && lastFocused.focus) lastFocused.focus();
    }

    lightbox.addEventListener('click', (e) => {
      if (e.target !== lightboxImg) closeLightbox();
    });

    galleryItems.forEach((item) => {
      const el = document.createElement('article');
      el.className = 'gallery-item kinetic-skew';
      el.setAttribute('tabindex', '0');
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', `Open ${item.title} full screen`);
      el.innerHTML = `
        <div class="img-frame">
          <img src="${item.src}" alt="${item.title}" loading="lazy" />
        </div>
        <div class="item-caption">
          <span class="serif-label">${item.title}</span>
          <span>[${item.id} // WEBP]</span>
        </div>
      `;
      el.addEventListener('click', () => openLightbox(item));
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openLightbox(item);
        }
      });
      editorialGrid.appendChild(el);
    });

    // 3. Lenis Smooth Scroll + Velocity Physics + Video Scrubbing
    const video = document.getElementById('heroVideo');
    const cinemaSection = document.getElementById('cinemaSection');
    const timecodeDisplay = document.getElementById('timecodeDisplay');
    const liveVelocity = document.getElementById('liveVelocity');

    function formatTimecode(t) {
      const s = Math.floor(t);
      const f = Math.floor((t - s) * 100);
      return `TC 00:${String(s).padStart(2, '0')}.${String(f).padStart(2, '0')}`;
    }

    if (!reduceMotion && typeof Lenis !== 'undefined') {
      lenis = new Lenis({ lerp: 0.09, smoothWheel: true });
      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }
      requestAnimationFrame(raf);

      let lastScrub = -1;
      let lastScrubAt = 0;

      lenis.on('scroll', ({ scroll, velocity }) => {
        const clampedVel = Math.max(-25, Math.min(25, velocity));
        document.documentElement.style.setProperty('--scroll-velocity', clampedVel.toFixed(2));
        liveVelocity.textContent = `VEL // ${Math.abs(velocity).toFixed(2)} px/f`;

        // Scrub clip-01.mp4 based on hero scroll progress (throttled: seek is decoder-heavy on phones)
        if (video.duration) {
          const maxScroll = cinemaSection.offsetHeight - window.innerHeight;
          if (maxScroll > 0) {
            const progress = Math.max(0, Math.min(1, scroll / maxScroll));
            const target = progress * video.duration;
            const now = performance.now();
            if (Math.abs(target - lastScrub) > 0.15 || now - lastScrubAt > 250) {
              video.currentTime = target;
              lastScrub = target;
              lastScrubAt = now;
            }
            timecodeDisplay.textContent = formatTimecode(target);
          }
        }
      });
    } else {
      // Reduced motion (or no Lenis): hold a single still frame, no scrubbing
      video.addEventListener('loadedmetadata', () => { video.currentTime = 0.01; });
      liveVelocity.textContent = 'VEL // reduced motion';
    }

    // 4. Escape closes the lightbox
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    // NOTE: this page deliberately does NOT register sw.js.
    // The site's service worker caches navigations under a single 'index.html'
    // key, so registering it here would overwrite the homepage's offline copy.
  </script>
</body>
</html>
